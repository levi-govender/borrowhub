spring.application.name=borrowhub-backend
server.port=8080
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/borrowhub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:borrowhub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:borrowhub}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

borrowhub.policy.office-timezone=Africa/Johannesburg
borrowhub.policy.min-duration-minutes=15
borrowhub.policy.max-duration-days=7
borrowhub.policy.max-advance-days=30
borrowhub.policy.collection-lead-minutes=15

borrowhub.demo-identity.enabled=false
borrowhub.demo-identity.default-tenant-id=dev-tenant
borrowhub.idempotency.ttl-hours=24

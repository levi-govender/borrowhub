spring.application.name=borrowhub-backend
server.port=8080
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/borrowhub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:borrowhub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:borrowhub}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @borrowhub/bff test
      - run: pnpm --filter @borrowhub/web test
      - run: pnpm --filter @borrowhub/mobile test
      - run: pnpm --filter @borrowhub/web build
      - run: pnpm --filter @borrowhub/bff build

  java:
    name: Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test
        working-directory: services/backend
        run: ./gradlew test --no-daemon

  bicep:
    name: Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep CLI
        run: az bicep install
      - run: az bicep build --file infra/main.bicep --outfile /tmp/borrowhub-main.json

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @borrowhub/web exec playwright install --with-deps chromium
      - name: Start Postgres, Java, and BFF
        run: docker compose --profile apps up -d --wait --build
      - name: Admin UI journeys
        run: pnpm --filter @borrowhub/web test:e2e
      - name: Stop Compose
        if: always()
        run: docker compose --profile apps down

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: borrowhub-postgres
    environment:
      POSTGRES_DB: borrowhub
      POSTGRES_USER: borrowhub
      POSTGRES_PASSWORD: borrowhub
    ports:
      - "5432:5432"
    volumes:
      - borrowhub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borrowhub -d borrowhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  borrowhub_pg:
